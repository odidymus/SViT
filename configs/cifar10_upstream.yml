# Spikingformer CIFAR-10 recipe (Spikformer/Spikingformer upstream hyper-parameters).
# Usage:  python scripts/train.py -c configs/cifar10_upstream.yml --dataset-download
# Checkpoints go to models/<run-name>/ (model_best.pth.tar, last.pth.tar, checkpoint-*.pth.tar)
# and a copy of the newest best is kept at models/best_model.pth.tar.

# model: Spikingformer-4-384, T=4
time_step: 4
layer: 4
dim: 384
num_heads: 12
patch_size: 4
mlp_ratio: 4
img_size: 32
num_classes: 10

# data
data_dir: data/cifar10
dataset: torch/cifar10
train_split: train
val_split: validation
mean: [0.4914, 0.4822, 0.4465]
std: [0.2470, 0.2435, 0.2616]
crop_pct: 1.0
# IMPORTANT for 32x32 images: timm's defaults (scale 0.08-1.0 random-resized
# crop, colour jitter 0.4) wreck CIFAR-10; upstream keeps full-size crops.
scale: [1.0, 1.0]
ratio: [1.0, 1.0]
hflip: 0.5
color_jitter: 0.0
interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-n1-mstd0.4-inc1
reprob: 0.25
remode: const
mixup: 0.5
cutmix: 0.0
mixup_prob: 1.0
mixup_switch_prob: 0.5
mixup_mode: batch
mixup_off_epoch: 200
smoothing: 0.1

# optimisation
opt: adamw
lr: 5.0e-4
weight_decay: 6.0e-2
sched: cosine
epochs: 400
warmup_epochs: 20
warmup_lr: 1.0e-5
min_lr: 1.0e-5
cooldown_epochs: 10
batch_size: 64
val_batch_size: 64
amp: true
workers: 8

# outputs
eval_metric: top1
checkpoint_hist: 5
log_interval: 100
